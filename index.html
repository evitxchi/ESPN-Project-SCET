<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESPN Video Desk</title>
  <meta name="description" content="Internal dashboard for weekly ESPN video assignments, live games, transcripts, and timestamped AI research.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <div class="live-banner" id="live-banner" aria-label="Live now"></div>

    <header class="topbar">
      <button class="icon-btn mobile-only" data-act="nav-toggle" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <a class="espn-logo" href="#/home" aria-label="ESPN Video Desk home"><span>ESPN</span></a>
      <a class="product" href="#/home">Video Desk</a>
      <nav class="league-links" id="league-links" aria-label="Leagues"></nav>
      <div class="nav-right">
        <button class="nav-tool refresh-tool" id="refresh-btn" data-act="refresh" title="Updates assignments, live events, schedules, newly available video, and your personalized daily feed. (R)"></button>
        <span class="refresh-meta" id="refresh-meta"></span>
        <button class="nav-tool hide-sm" data-act="go" data-h="#/assignments" title="Assignments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg><span class="lbl">Assignments</span></button>
        <button class="nav-tool hide-sm" data-act="go" data-h="#/chat" title="Ask ESPN"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="lbl">Ask ESPN</span></button>
        <button class="icon-btn" data-act="palette-open" aria-label="Search (⌘K)" title="Search or ask (⌘K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button class="icon-btn" data-act="notif-toggle" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge-count" id="bell-count" hidden></span>
        </button>
        <a class="icon-btn" href="#/settings" aria-label="Profile and settings"><span class="avatar">M</span></a>
      </div>
    </header>

    <div class="body-grid">
      <nav class="sidebar" id="sidebar" aria-label="Primary"></nav>
      <div class="main-wrap" id="main-wrap">
        <main id="main" tabindex="-1"></main>
        <aside class="rail" id="rail" aria-label="Due today, alerts and reminders"></aside>
      </div>
    </div>
  </div>

  <div id="layer"></div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
