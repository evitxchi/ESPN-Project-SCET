<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESPN Video Desk</title>
  <meta name="description" content="Internal dashboard for weekly ESPN video assignments, live games, transcripts, and timestamped AI research.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <div class="live-banner" id="live-banner" aria-label="Live now"></div>

    <header class="topbar">
      <button class="icon-btn mobile-only" data-act="nav-toggle" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <a class="brand" href="#/home" style="text-decoration:none;color:inherit"><span class="brand-mark">ESPN</span> VIDEO DESK <small>internal</small></a>
      <div class="searchbar" role="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="global-search" placeholder="Search videos, or ask anything…" aria-label="Search or ask">
        <button class="kbd" data-act="palette-open" style="background:none;color:inherit;cursor:pointer" aria-label="Open command palette">⌘K</button>
      </div>
      <div class="refresh">
        <div class="refresh-meta" id="refresh-meta"></div>
        <button class="btn-refresh" id="refresh-btn" data-act="refresh" title="Updates assignments, live events, schedules, newly available video, and your personalized daily feed. (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          <span class="lbl">Refresh ESPN Now</span>
        </button>
      </div>
      <button class="icon-btn" data-act="notif-toggle" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="badge-count" id="bell-count" hidden></span>
      </button>
    </header>

    <div class="body-grid">
      <nav class="sidebar" id="sidebar" aria-label="Primary"></nav>
      <div class="main-wrap" id="main-wrap">
        <main id="main" tabindex="-1"></main>
        <aside class="rail" id="rail" aria-label="Due today, alerts and reminders"></aside>
      </div>
    </div>
  </div>

  <div id="layer"></div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
